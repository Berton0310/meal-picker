<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="今天吃什麼" />
  <meta name="theme-color" content="#171514" />
  <title>今天吃什麼 · Meal Picker</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon-180.png" />
  <link rel="icon" type="image/png" href="./assets/icon-512.png" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-page: #EAE6DF;
      --ink-main: #1A1A1A;
      --ink-muted: #6C675F;
      --line-subtle: rgba(26, 26, 26, 0.12);
      --pill-bg: rgba(26, 26, 26, 0.06);
      --pill-active-bg: #1A1A1A;
      --pill-active-ink: #FAF8F5;
      --cta-bg: #E85D2A;
      --cta-ink: #FFFFFF;
      --cta-shadow: 0 4px 0 #A83A14;
      --sec-bg: rgba(26, 26, 26, 0.07);
      --sec-ink: #1A1A1A;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      --font-serif: "Noto Serif TC", "Songti TC", "PMingLiU", "Georgia", serif;
      --ease-spring: cubic-bezier(0.22, 0.85, 0.25, 1);
    }

    /* ==================== 四種風格獨立視覺定義 ==================== */
    body[data-theme="slot"] {
      --bg-page: #EAE6DF;
      --ink-main: #1A1917;
      --ink-muted: #6B665D;
      --line-subtle: rgba(26, 25, 23, 0.13);
      --pill-bg: rgba(26, 25, 23, 0.06);
      --pill-active-bg: #1A1917;
      --pill-active-ink: #F5F2EC;
      --cta-bg: #E85D2A;
      --cta-ink: #FFFFFF;
      --cta-shadow: 0 4px 0 #9F3510;
      --sec-bg: #DCD6CB;
      --sec-ink: #1A1917;
    }

    body[data-theme="deck"] {
      --bg-page: #171514;
      --ink-main: #FAF6F0;
      --ink-muted: #9D968D;
      --line-subtle: rgba(250, 246, 240, 0.14);
      --pill-bg: rgba(250, 246, 240, 0.07);
      --pill-active-bg: #FAF6F0;
      --pill-active-ink: #171514;
      --cta-bg: #FAF6F0;
      --cta-ink: #171514;
      --cta-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      --sec-bg: rgba(250, 246, 240, 0.08);
      --sec-ink: #FAF6F0;
    }

    body[data-theme="omikuji"] {
      --bg-page: #F3EFE6;
      --ink-main: #1D1B18;
      --ink-muted: #706A60;
      --line-subtle: rgba(29, 27, 24, 0.16);
      --pill-bg: rgba(29, 27, 24, 0.05);
      --pill-active-bg: #C83E2B;
      --pill-active-ink: #FDFBF7;
      --cta-bg: #C83E2B;
      --cta-ink: #FDFBF7;
      --cta-shadow: 0 6px 18px rgba(200, 62, 43, 0.25);
      --sec-bg: rgba(29, 27, 24, 0.07);
      --sec-ink: #1D1B18;
    }

    body[data-theme="wheel"] {
      --bg-page: #11161A;
      --ink-main: #F2F4F5;
      --ink-muted: #8A959E;
      --line-subtle: rgba(242, 244, 245, 0.14);
      --pill-bg: rgba(242, 244, 245, 0.07);
      --pill-active-bg: #D95D34;
      --pill-active-ink: #FFFFFF;
      --cta-bg: #D95D34;
      --cta-ink: #FFFFFF;
      --cta-shadow: 0 8px 24px rgba(217, 93, 52, 0.3);
      --sec-bg: rgba(242, 244, 245, 0.08);
      --sec-ink: #F2F4F5;
    }

    html, body {
      min-height: 100%;
      background-color: var(--bg-page);
      color: var(--ink-main);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.35s ease, color 0.35s ease;
      overscroll-behavior-y: contain;
    }

    body[data-theme="omikuji"] {
      background-image: radial-gradient(rgba(29, 27, 24, 0.04) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    button {
      font-family: inherit;
      color: inherit;
      border: none;
      background: transparent;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        calc(env(safe-area-inset-top, 12px) + 10px)
        16px
        calc(env(safe-area-inset-bottom, 16px) + 18px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    /* ==================== 1. 頂部：風格模擬切換 ＋ 分類篩選 ==================== */
    .top-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .style-switcher {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 4px;
      border-radius: 12px;
      background: var(--pill-bg);
      border: 1px solid var(--line-subtle);
    }

    .style-tab {
      padding: 7px 4px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
      white-space: nowrap;
    }

    .style-tab.is-active {
      background: var(--pill-active-bg);
      color: var(--pill-active-ink);
    }

    .style-tab:active {
      transform: scale(0.95);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-scroll {
      flex: 1;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 0;
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    .cat-pill {
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-muted);
      background: var(--pill-bg);
      flex-shrink: 0;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }

    .cat-pill.is-active {
      background: var(--pill-active-bg);
      color: var(--pill-active-ink);
    }

    .cat-pill:active, .open-toggle:active {
      transform: scale(0.94);
    }

    .open-toggle {
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      border: 1px solid var(--line-subtle);
      color: var(--ink-muted);
      transition: all 0.2s ease;
    }

    .open-toggle.is-active {
      background: var(--pill-active-bg);
      border-color: var(--pill-active-bg);
      color: var(--pill-active-ink);
    }

    /* ==================== 2. 中央抽籤動畫主舞台 ==================== */
    .stage-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 6px 0;
    }

    .empty-panel {
      width: 100%;
      padding: 36px 24px;
      border-radius: 20px;
      border: 1px dashed var(--line-subtle);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .empty-title {
      font-size: 16px;
      font-weight: 700;
    }
    .empty-sub {
      font-size: 13px;
      color: var(--ink-muted);
      line-height: 1.5;
      max-width: 280px;
    }
    .empty-action-btn {
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--pill-active-bg);
      color: var(--pill-active-ink);
      font-size: 13px;
      font-weight: 600;
    }

    /* -------------------- 方案 A：Braun 機械滾輪拉霸機 -------------------- */
    .slot-machine {
      width: 100%;
    }

    .slot-bezel {
      background: #D9D4CB;
      border-radius: 22px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow:
        0 18px 40px rgba(26, 25, 23, 0.14),
        inset 0 -3px 0 rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slot-window-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }

    .slot-serial {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #6B665D;
    }

    .slot-reel-viewport {
      position: relative;
      height: 204px; /* 3 rows x 68px */
      border-radius: 14px;
      background: #141416;
      overflow: hidden;
      border: 2px solid #2A2A2D;
      box-shadow: inset 0 6px 18px rgba(0, 0, 0, 0.75);
    }

    .slot-reel-track {
      padding: 68px 28px; /* 讓 index 17 精準對齊中央線 (68px ~ 136px) */
      will-change: transform;
    }

    .slot-reel-track.is-blur .slot-reel-item {
      filter: blur(1.4px);
      opacity: 0.85;
    }

    .slot-reel-item {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #F4F1EA;
      font-size: clamp(1.15rem, 4.5vw, 1.42rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.25;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: filter 0.2s ease;
    }

    .slot-glass-mask {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(14, 14, 16, 0.94) 0%,
        rgba(14, 14, 16, 0.55) 26%,
        rgba(14, 14, 16, 0) 36%,
        rgba(14, 14, 16, 0) 64%,
        rgba(14, 14, 16, 0.55) 74%,
        rgba(14, 14, 16, 0.94) 100%
      );
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    .slot-pointer {
      position: absolute;
      top: 50%;
      width: 0;
      height: 0;
      transform: translateY(-50%);
      z-index: 3;
    }
    .slot-pointer-left {
      left: 7px;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 9px solid #E85D2A;
    }
    .slot-pointer-right {
      right: 7px;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 9px solid #E85D2A;
    }

    .slot-flap-panel {
      background: #1C1C1E;
      border-radius: 12px;
      padding: 13px 14px;
      color: #F4F1EA;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transform-origin: top center;
    }

    .slot-flap-panel.is-flipping {
      animation: flapDrop 0.35s var(--ease-spring);
    }

    @keyframes flapDrop {
      0% { transform: perspective(600px) rotateX(-55deg); opacity: 0.4; }
      100% { transform: perspective(600px) rotateX(0deg); opacity: 1; }
    }

    .slot-flap-sub {
      font-size: 13px;
      color: #D2CEC4;
      line-height: 1.45;
    }

    .slot-flap-meta {
      font-size: 12px;
      color: #E85D2A;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    /* -------------------- 方案 B：3D 實體牌疊洗牌 ＆ 滑卡 -------------------- */
    .deck-scene {
      position: relative;
      width: 100%;
      max-width: 336px;
      height: 360px;
      perspective: 1100px;
      touch-action: none;
    }

    .deck-card {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background: #FAF6F0;
      color: #1A1917;
      padding: 14px;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.55);
      transition: transform 0.45s var(--ease-spring), opacity 0.3s ease;
      transform-origin: center center;
    }

    .deck-back-2 {
      background: #DFD8CC;
      transform: translate3d(10px, 12px, -40px) rotate(4.2deg);
      z-index: 1;
    }

    .deck-back-1 {
      background: #ECE6DC;
      transform: translate3d(-8px, 6px, -20px) rotate(-3.5deg);
      z-index: 2;
    }

    .deck-back-1.is-shuffling-left {
      transform: translate3d(-64px, -8px, -10px) rotate(-14deg);
    }

    .deck-back-2.is-shuffling-right {
      transform: translate3d(64px, 4px, -10px) rotate(14deg);
    }

    .deck-front {
      z-index: 3;
      cursor: grab;
    }
    .deck-front:active {
      cursor: grabbing;
    }

    .deck-front.is-flipping-in {
      animation: cardFlipIn 0.56s var(--ease-spring);
    }

    @keyframes cardFlipIn {
      0% { transform: perspective(900px) rotateY(-88deg) scale(0.92); opacity: 0.3; }
      55% { transform: perspective(900px) rotateY(8deg) scale(1.02); opacity: 1; }
      100% { transform: perspective(900px) rotateY(0deg) scale(1); opacity: 1; }
    }

    .deck-card-inner {
      height: 100%;
      border: 1px solid rgba(26, 25, 23, 0.16);
      border-radius: 11px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .deck-top-line {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #7D766B;
    }

    .deck-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .deck-name {
      font-family: var(--font-serif);
      font-size: clamp(1.42rem, 5.2vw, 1.78rem);
      font-weight: 800;
      line-height: 1.3;
      color: #1A1917;
    }

    .deck-note {
      font-size: 13.5px;
      color: #5C574F;
      line-height: 1.55;
    }

    .deck-bottom-line {
      padding-top: 12px;
      border-top: 1px solid rgba(26, 25, 23, 0.14);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: #1A1917;
      gap: 8px;
    }

    .deck-hint {
      font-size: 11px;
      color: #8A8378;
      font-weight: 500;
      flex-shrink: 0;
    }

    /* -------------------- 方案 C：日式搖籤筒／今日食籤 -------------------- */
    .omikuji-scene {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 360px;
    }

    .omikuji-slip {
      width: 100%;
      max-width: 318px;
      background: #FAF7F0;
      border: 1.5px solid #1D1B18;
      padding: 7px;
      box-shadow: 0 18px 40px rgba(29, 27, 24, 0.1);
      transform-origin: top center;
    }

    .omikuji-slip.is-unfolding {
      animation: slipUnfold 0.42s var(--ease-spring);
    }

    @keyframes slipUnfold {
      0% { transform: scaleY(0.15); opacity: 0; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    .omikuji-inner-frame {
      border: 1px solid rgba(29, 27, 24, 0.45);
      padding: 20px 20px 18px;
      min-height: 336px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: var(--font-serif);
    }

    .omikuji-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(29, 27, 24, 0.18);
    }

    .omikuji-label {
      font-size: 12px;
      letter-spacing: 0.16em;
      color: #5C574E;
      font-weight: 700;
    }

    .omikuji-stamp {
      width: 28px;
      height: 28px;
      border: 1.5px solid #C83E2B;
      color: #C83E2B;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      transform: rotate(-6deg);
    }

    .omikuji-center {
      padding: 26px 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .omikuji-name {
      font-size: clamp(1.48rem, 5.4vw, 1.85rem);
      font-weight: 800;
      line-height: 1.35;
      color: #1D1B18;
      letter-spacing: 0.03em;
    }

    .omikuji-note {
      font-family: var(--font-sans);
      font-size: 13px;
      color: #5E594F;
      line-height: 1.55;
    }

    .omikuji-foot {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: center;
    }

    .omikuji-divider {
      display: block;
      width: 36px;
      height: 1.5px;
      background: #C83E2B;
      margin: 0 auto;
    }

    .omikuji-meta {
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      color: #1D1B18;
    }

    .omikuji-shaker-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 72px;
    }

    .omikuji-box-svg {
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 16px 24px rgba(29, 27, 24, 0.22));
    }

    .omikuji-box-svg.is-shaking {
      animation: omikujiShake 0.52s ease-in-out;
    }

    @keyframes omikujiShake {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      15% { transform: rotate(-11deg) translateY(-6px); }
      30% { transform: rotate(11deg) translateY(4px); }
      45% { transform: rotate(-10deg) translateY(-5px); }
      60% { transform: rotate(10deg) translateY(3px); }
      75% { transform: rotate(-6deg) translateY(-3px); }
    }

    .omikuji-stick {
      position: absolute;
      top: 86px;
      width: 14px;
      height: 104px;
      background: #DFC08D;
      border: 1px solid #8B5A2B;
      border-radius: 3px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: transform 0.36s var(--ease-spring), opacity 0.15s ease;
    }

    .omikuji-stick.is-rising {
      opacity: 1;
      transform: translateY(-78px);
    }

    .stick-tip {
      width: 100%;
      height: 16px;
      background: #C83E2B;
    }

    .stick-num {
      writing-mode: vertical-rl;
      font-family: var(--font-serif);
      font-size: 10px;
      font-weight: 700;
      color: #2B1D0E;
      margin-top: 6px;
    }

    /* -------------------- 方案 D：慣性物理美食轉盤 -------------------- */
    .wheel-scene {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .wheel-dial-wrap {
      position: relative;
      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel-rotator {
      width: 100%;
      height: 100%;
      will-change: transform;
    }

    .wheel-svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.55));
    }

    .wheel-pointer {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 18px solid #D95D34;
      z-index: 4;
      transform-origin: 50% 0%;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.5));
    }

    .wheel-pointer.is-ticking {
      animation: pointerTick 0.11s ease-out;
    }

    @keyframes pointerTick {
      0% { transform: translateX(-50%) rotate(0deg); }
      45% { transform: translateX(-50%) rotate(-18deg); }
      100% { transform: translateX(-50%) rotate(0deg); }
    }

    .wheel-hub {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 999px;
      background: #1C242B;
      border: 2px solid rgba(255, 255, 255, 0.28);
      color: #F2F4F5;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      z-index: 5;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s ease;
    }
    .wheel-hub:active {
      transform: scale(0.92);
    }

    .wheel-result-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(242, 244, 245, 0.12);
      border-radius: 16px;
      padding: 14px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .wheel-result-card.is-revealed {
      animation: resultPop 0.32s var(--ease-spring);
    }

    @keyframes resultPop {
      0% { transform: scale(0.96); opacity: 0.6; }
      100% { transform: scale(1); opacity: 1; }
    }

    .wheel-result-name {
      font-size: clamp(1.18rem, 4.4vw, 1.4rem);
      font-weight: 700;
      color: #F2F4F5;
    }

    .wheel-result-sub {
      font-size: 12.5px;
      color: #8A959E;
      line-height: 1.45;
    }

    /* ==================== 3. 底部極簡雙動作列 ==================== */
    .action-dock {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 10px;
      padding-top: 4px;
    }

    .action-primary {
      padding: 15px 16px;
      border-radius: 14px;
      background: var(--cta-bg);
      color: var(--cta-ink);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: var(--cta-shadow);
      transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease;
    }

    .action-primary:active:not(:disabled) {
      transform: translateY(3px) scale(0.985);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
    }

    .action-secondary {
      padding: 15px 14px;
      border-radius: 14px;
      background: var(--sec-bg);
      color: var(--sec-ink);
      border: 1px solid var(--line-subtle);
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.14s ease, opacity 0.14s ease;
    }

    .action-secondary:active:not(:disabled) {
      transform: scale(0.96);
    }
  </style>
</head>
<body data-theme="slot">
  <main class="app-shell">

    <!-- 1. 頂部：四種視覺風格試玩切換 ＋ 極簡分類與營業開關 -->
    <header class="top-bar">
      <div class="style-switcher" role="tablist" aria-label="視覺動畫風格切換">
        <button type="button" class="style-tab is-active" data-style="slot">A 機械拉霸</button>
        <button type="button" class="style-tab" data-style="deck">B 3D 牌疊</button>
        <button type="button" class="style-tab" data-style="omikuji">C 日式食籤</button>
        <button type="button" class="style-tab" data-style="wheel">D 物理轉盤</button>
      </div>

      <div class="filter-bar">
        <div class="category-scroll" id="categoryRow"></div>
        <button type="button" id="openToggleBtn" class="open-toggle is-active">營業中</button>
      </div>
    </header>

    <!-- 2. 中央抽籤動畫主舞台 -->
    <section class="stage-area" id="stageArea" aria-live="polite"></section>

    <!-- 3. 底部極簡雙動作列 -->
    <footer class="action-dock">
      <button type="button" id="goEatBtn" class="action-primary">出發去吃</button>
      <button type="button" id="redrawBtn" class="action-secondary">拉動手把再抽</button>
    </footer>

  </main>

  <script src="./app.js"></script>
</body>
</html>
