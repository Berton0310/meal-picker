<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="今天吃什麼" />
  <meta name="theme-color" content="#0E1318" />
  <title>今天吃什麼 · Meal Picker</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon-180.png" />
  <link rel="icon" type="image/png" href="./assets/icon-512.png" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-outer: #080B0F;
      --map-fallback: #10171D;
      --glass-bg: rgba(14, 19, 24, 0.80);
      --glass-strong: rgba(14, 19, 24, 0.90);
      --glass-border: rgba(255, 255, 255, 0.14);
      --ink-main: #F4F6F8;
      --ink-muted: #A3AEB8;
      --accent: #EA5828;
      --accent-dark: #B33B14;
      --accent-ink: #FFFFFF;
      --pill-bg: rgba(255, 255, 255, 0.08);
      --pill-active-bg: #F4F6F8;
      --pill-active-ink: #11161C;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --ease-spring: cubic-bezier(0.22, 0.88, 0.28, 1);
    }

    body[data-layer="street"] {
      --map-fallback: #DFDCD4;
    }

    body[data-layer="dark"] {
      --map-fallback: #0F1317;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-outer);
      color: var(--ink-main);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      overscroll-behavior: none;
    }

    button {
      font-family: inherit;
      color: inherit;
      border: none;
      background: transparent;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: 460px;
      height: 100dvh;
      margin: 0 auto;
      background-color: var(--map-fallback);
      overflow: hidden;
      transition: background-color 0.3s ease;
    }

    @media (min-width: 500px) {
      .app-shell {
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 28px 80px rgba(0, 0, 0, 0.72);
      }
    }

    .map-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }

    .map-canvas:active {
      cursor: grabbing;
    }

    .map-scrim-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 148px;
      background: linear-gradient(180deg, rgba(8, 12, 16, 0.62) 0%, rgba(8, 12, 16, 0) 100%);
      pointer-events: none;
      z-index: 2;
    }

    .map-scrim-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 220px;
      background: linear-gradient(0deg, rgba(8, 12, 16, 0.72) 0%, rgba(8, 12, 16, 0) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* ==================== 1. 頂部 HUD 控制區 ==================== */
    .hud-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      padding: calc(env(safe-area-inset-top, 10px) + 10px) 12px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .hud-top > * {
      pointer-events: auto;
    }

    .hud-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-switcher {
      flex: 1;
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      padding: 4px;
      border-radius: 13px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
    }

    .mode-tab {
      padding: 7px 4px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-muted);
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .mode-tab.is-active {
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow: 0 2px 8px rgba(234, 88, 40, 0.35);
    }

    .layer-toggle {
      flex-shrink: 0;
      height: 38px;
      padding: 0 12px;
      border-radius: 13px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-main);
      transition: transform 0.14s ease, border-color 0.2s ease;
    }

    .layer-toggle:active {
      transform: scale(0.95);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .category-scroll {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      color: var(--ink-main);
      font-size: 12px;
      font-weight: 500;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .cat-pill.is-active {
      background: var(--pill-active-bg);
      color: var(--pill-active-ink);
      border-color: var(--pill-active-bg);
      font-weight: 700;
    }

    .open-toggle {
      flex-shrink: 0;
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-muted);
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .open-toggle.is-active {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    .hud-telemetry {
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 5px 10px;
      border-radius: 10px;
      background: rgba(12, 16, 21, 0.68);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
    }

    .hud-coord {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.02em;
      color: rgba(244, 246, 248, 0.78);
      white-space: nowrap;
    }

    .hud-status {
      color: #FF8E63;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ==================== 2. 底部右側縮放工具 ＋ 懸浮資訊卡片 ==================== */
    .bottom-dock-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      padding: 0 12px calc(env(safe-area-inset-bottom, 12px) + 12px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .map-tools {
      align-self: flex-end;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      pointer-events: auto;
    }

    .map-tool-btn {
      width: 38px;
      height: 36px;
      border-radius: 11px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      color: var(--ink-main);
      font-size: 16px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.32);
      transition: transform 0.14s ease, background-color 0.15s ease;
    }

    .map-tool-btn:active {
      transform: scale(0.92);
    }

    .map-tool-wide {
      width: auto;
      padding: 0 11px;
      font-size: 11.5px;
      font-weight: 600;
    }

    .bottom-sheet {
      pointer-events: auto;
      background: var(--glass-strong);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 15px 15px 13px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .place-card {
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: opacity 0.22s ease, transform 0.26s var(--ease-spring);
    }

    .place-card.is-flying {
      opacity: 0.62;
      transform: scale(0.97) translateY(3px);
    }

    .place-card.is-landed {
      animation: cardLanded 0.36s var(--ease-spring);
    }

    @keyframes cardLanded {
      0% { opacity: 0.55; transform: scale(0.96) translateY(6px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .card-title {
      font-size: clamp(1.22rem, 4.7vw, 1.45rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.24;
      color: var(--ink-main);
    }

    .card-sub {
      font-size: 13px;
      line-height: 1.42;
      color: #C7D0D8;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      font-size: 12px;
      font-weight: 600;
      color: #FF8E63;
      line-height: 1.35;
    }

    .empty-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .empty-panel[hidden],
    .place-card[hidden] {
      display: none;
    }

    .empty-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-main);
    }

    .empty-sub {
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--ink-muted);
    }

    .empty-action-btn {
      margin-top: 2px;
      padding: 8px 14px;
      border-radius: 10px;
      background: var(--pill-bg);
      border: 1px solid var(--glass-border);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-main);
    }

    .action-dock {
      display: grid;
      grid-template-columns: 1.22fr 1fr;
      gap: 9px;
    }

    .action-primary {
      padding: 13px 14px;
      border-radius: 13px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 0 3px 0 var(--accent-dark), 0 8px 18px rgba(234, 88, 40, 0.28);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .action-primary:active:not(:disabled) {
      transform: translateY(2px) scale(0.985);
      box-shadow: 0 1px 0 var(--accent-dark);
    }

    .action-secondary {
      padding: 13px 12px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: var(--ink-main);
      font-size: 13.5px;
      font-weight: 600;
      transition: transform 0.14s ease, background-color 0.14s ease;
    }

    .action-secondary:active:not(:disabled) {
      transform: scale(0.96);
    }

    .map-attrib {
      font-size: 10px;
      color: rgba(244, 246, 248, 0.48);
      text-align: right;
      line-height: 1;
      margin-top: -4px;
    }
  </style>
</head>
<body data-layer="sat">
  <main class="app-shell">
    <canvas id="mapCanvas" class="map-canvas"></canvas>
    <div class="map-scrim-top"></div>
    <div class="map-scrim-bottom"></div>

    <!-- 1. 頂部 HUD：三種鏡頭節奏切換 ＋ 底圖切換 ＋ 篩選與即時座標 -->
    <header class="hud-top">
      <div class="hud-bar-row">
        <div class="mode-switcher" role="tablist" aria-label="地圖鏡頭動畫模式">
          <button type="button" class="mode-tab is-active" data-mode="hop">A 跳躍俯衝</button>
          <button type="button" class="mode-tab" data-mode="fly">B 跨區飛行</button>
          <button type="button" class="mode-tab" data-mode="radar">C 鳥瞰掃描</button>
        </div>
        <button type="button" id="layerToggleBtn" class="layer-toggle" aria-label="切換地圖底圖">衛星</button>
      </div>

      <div class="filter-bar">
        <div class="category-scroll" id="categoryRow"></div>
        <button type="button" id="openToggleBtn" class="open-toggle is-active">營業中</button>
      </div>

      <div class="hud-telemetry">
        <span class="hud-coord" id="hudCoordText">24.1558°N  120.6822°E</span>
        <span class="hud-status" id="hudStatusText">候選 49 間</span>
      </div>
    </header>

    <!-- 2. 底部區域：右側縮放微調 ＋ 店家資訊卡與雙動作列 -->
    <section class="bottom-dock-wrap">
      <div class="map-tools">
        <button type="button" id="zoomInBtn" class="map-tool-btn" aria-label="放大地圖">＋</button>
        <button type="button" id="zoomOutBtn" class="map-tool-btn" aria-label="縮小地圖">－</button>
        <button type="button" id="overviewBtn" class="map-tool-btn map-tool-wide" aria-label="回到全區鳥瞰">全區</button>
      </div>

      <footer class="bottom-sheet" aria-live="polite">
        <div class="place-card" id="placeCard">
          <h2 class="card-title" id="cardTitle">載入中…</h2>
          <p class="card-sub" id="cardSub"></p>
          <p class="card-meta" id="cardMeta"></p>
        </div>

        <div class="empty-panel" id="emptyPanel" hidden>
          <div class="empty-title">目前這個分類沒有在營業的店家</div>
          <p class="empty-sub">可能是午休或深夜時段，切換為「不限時段」就能從全部口袋名單抽籤。</p>
          <button type="button" id="emptyShowAllBtn" class="empty-action-btn">改為不限時段</button>
        </div>

        <div class="action-dock">
          <button type="button" id="goEatBtn" class="action-primary">出發去吃</button>
          <button type="button" id="redrawBtn" class="action-secondary">跳躍抽下一間</button>
        </div>

        <div class="map-attrib" id="mapAttrib">衛星圖資 © Esri</div>
      </footer>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
